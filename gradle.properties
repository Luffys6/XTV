org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.enableJetifier=false

# ================= 答题锁配置（改这里，然后重新编译安装即可） =================
# ⚠ 敏感项（AI_API_KEY / LICENSE_SECRET）不放在这个文件里（本文件入库 git），
#    请写到项目根目录的 secrets.properties（已 gitignore，不入库）
# 主模型：glm-5.3-flash（新用户资源包，2026-12-05 前免费用；出题质量最好，带 low 档思考）。
# 注意：思考型模型一批题 30~70 秒，App 的读超时已放宽到 90 秒；走 NAT/代理且
# 掐 60 秒以上长连接的网络仍可能超时——超时会自动降级到下面的免费快模型
AI_MODEL=glm-5.3-flash
# 第一降级模型（主模型限流/超时后先用它）。glm-4.7-flash 间歇性 1305 全局过载
# （2026-11-06 实测连拒 3 次且同刻 4-flash/5.3-flash 都正常），降为末位兜底
AI_MODEL_FALLBACK=glm-4-flash
# 接口地址（换其他平台只改这里和模型名）
AI_BASE_URL=https://open.bigmodel.cn/api/paas/v4/chat/completions
# 默认年级（1~9），App 里也能改
DEFAULT_GRADE=5

# ================= 使用期限（月卡）=================
# 是否启用使用期限限制：
#   false（默认）= 永久使用，不限制、不需要激活码，装上即可一直用
#   true          = 启用月卡：首次安装免费 30 天，到期后需输激活码续期
LICENSE_ENFORCE=false
# 激活码签名密钥：写在 secrets.properties 的 LICENSE_SECRET（不入库，构建时异或后打进 APK）
# 换密钥会让已发出的激活码全部失效
# 月卡天数（生成工具默认值，最少 30）
LICENSE_MONTH_DAYS=30
